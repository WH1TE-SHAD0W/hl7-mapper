[project]
name = "hl7msg"
version = "0.1.0"
description = "HL7 Message Data Explorer - flatten and search HL7 v2 XML messages"
requires-python = ">=3.10"
dependencies = ["flet[desktop]==0.86.4", "openpyxl>=3.1", "lxml>=6.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Build-time only: needed to produce the .exe, never at runtime.
build = ["flet-cli==0.86.4", "pyinstaller>=6.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
