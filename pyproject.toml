[project]
name = "sickcert"
version = "0.1.0"
description = "Sick Certificate Data Explorer - HL7 ORU_R01 message analysis desktop application"
requires-python = ">=3.10"
dependencies = ["flet[desktop]==0.86.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
